name: KeyHop Hysteria 1

on:
  push:
    branches:
      - keyhop-hysteria1
    tags:
      - "v1.3.5-keyhop.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Hysteria
        uses: actions/checkout@v4
        with:
          path: hysteria

      - name: Checkout KeyHop QUIC
        uses: actions/checkout@v4
        with:
          repository: Ilyandr/quic-go
          ref: keyhop-quic-lock
          path: quic-go

      - name: Setup Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: false

      - name: Configure QUIC dependency
        run: |
          cd hysteria/core
          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

          cd ../app
          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          cd hysteria/app

          go build -trimpath \
            -ldflags="-s -w" \
            -o ../../dist/hysteria1-keyhop-linux-${GOARCH} \
            ./cmd

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hysteria1-keyhop-linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum hysteria1-keyhop-linux-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true