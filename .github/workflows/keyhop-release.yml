
name: KeyHop Hysteria 1

on:
  push:
    branches:
      - keyhop-hysteria1
    tags:
      - "v1.3.5-keyhop.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Hysteria
        uses: actions/checkout@v4
        with:
          path: hysteria
          persist-credentials: false

      - name: Checkout KeyHop QUIC
        uses: actions/checkout@v4
        with:
          repository: Ilyandr/quic-go
          ref: keyhop-quic-lock
          path: quic-go
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: false

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f hysteria/app/go.mod
          test -f hysteria/core/go.mod
          test -f quic-go/go.mod

          grep -q 'requiredStreamWindow' \
            quic-go/connection.go

          grep -q 'requiredConnWindow' \
            quic-go/connection.go

          echo "Hysteria commit:"
          git -C hysteria rev-parse HEAD

          echo "QUIC Lock commit:"
          git -C quic-go rev-parse HEAD

          echo "Go version:"
          go version

      - name: Configure dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd hysteria/core

          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

          cd ../app

          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

          echo "QUIC dependency:"
          go list -m -json github.com/quic-go/quic-go

      - name: Build Linux binary
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          mkdir -p dist

          cd hysteria/app

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "../../dist/hysteria1-keyhop-linux-${GOARCH}" \
            ./cmd

          cd ../..

          test -s "dist/hysteria1-keyhop-linux-${GOARCH}"

          chmod 755 "dist/hysteria1-keyhop-linux-${GOARCH}"

          file "dist/hysteria1-keyhop-linux-${GOARCH}"

      - name: Build DEB package
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.3.5-keyhop.0.dev${GITHUB_RUN_NUMBER}"
          fi

          PACKAGE="hysteria1-keyhop_${VERSION}_linux_${ARCH}.deb"

          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          install -m 755 \
            "dist/hysteria1-keyhop-linux-${ARCH}" \
            package/usr/bin/hysteria1-keyhop

          printf '%s\n' \
            "Package: hysteria1-keyhop" \
            "Version: ${VERSION}" \
            "Section: net" \
            "Priority: optional" \
            "Architecture: ${ARCH}" \
            "Maintainer: KeyHop <support@keyhop.tech>" \
            "Description: KeyHop Hysteria 1 with QUIC Window Lock" \
            > package/DEBIAN/control

          chmod 755 package/DEBIAN
          chmod 644 package/DEBIAN/control

          dpkg-deb --build --root-owner-group \
            package "dist/${PACKAGE}"

          dpkg-deb -I "dist/${PACKAGE}"

          dpkg-deb -c "dist/${PACKAGE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyhop-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          test -f hysteria1-keyhop-linux-amd64
          test -f hysteria1-keyhop-linux-arm64

          sha256sum hysteria1-keyhop-* > SHA256SUMS

          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true