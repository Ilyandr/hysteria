name: KeyHop Hysteria 1

on:
  push:
    branches:
      - keyhop-hysteria1
    tags:
      - "v1.3.5-keyhop.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          cd app
          go build -trimpath \
            -ldflags="-s -w" \
            -o ../dist/hysteria1-keyhop-linux-${GOARCH} \
            .

      - name: Generate checksum
        run: |
          cd dist
          sha256sum * > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
