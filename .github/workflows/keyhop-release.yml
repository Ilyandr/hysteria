name: KeyHop Hysteria 1

on:
  push:
    branches:
      - keyhop-hysteria1
    tags:
      - "v1.3.5-keyhop.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Hysteria
        uses: actions/checkout@v4
        with:
          path: hysteria

      - name: Checkout KeyHop QUIC
        uses: actions/checkout@v4
        with:
          repository: Ilyandr/quic-go
          ref: keyhop-quic-lock
          path: quic-go

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: false

      - name: Configure dependencies
        run: |
          cd hysteria/core
          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

          cd ../app
          go mod edit \
            -replace=github.com/quic-go/quic-go=../../quic-go

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          cd hysteria/app

          go build -trimpath \
            -ldflags="-s -w" \
            -o ../../dist/hysteria1-keyhop-linux-${GOARCH} \
            ./cmd

      - name: Build DEB package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="1.3.5-keyhop.1"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          PACKAGE="hysteria1-keyhop_${VERSION}_linux_${ARCH}.deb"

          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          install -m 755 \
            "dist/hysteria1-keyhop-linux-${ARCH}" \
            package/usr/bin/hysteria1-keyhop

          cat > package/DEBIAN/control <<EOF
          Package: hysteria1-keyhop
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: KeyHop <support@keyhop.tech>
          Description: KeyHop Hysteria 1 with custom QUIC transport checks
          EOF

          dpkg-deb --build --root-owner-group \
            package "dist/${PACKAGE}"

          dpkg-deb -I "dist/${PACKAGE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyhop-linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum hysteria1-keyhop-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true